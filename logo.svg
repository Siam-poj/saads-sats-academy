<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#grad)" />
  <circle cx="50" cy="50" r="36" fill="#ffffff" opacity="0.1" />
  
  <!-- Mortarboard Cap -->
  <polygon points="50,22 80,36 50,50 20,36" fill="#ffffff" />
  <path d="M30,42 L30,56 C30,64 70,64 70,56 L70,42" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  
  <!-- Tassel with Star -->
  <line x1="72" y1="38" x2="78" y2="52" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Lightning / Achievement Star in Center -->
  <path d="M50,44 L53,52 L62,53 L55,59 L57,68 L50,63 L43,68 L45,59 L38,53 L47,52 Z" fill="url(#goldGrad)" />
</svg>
